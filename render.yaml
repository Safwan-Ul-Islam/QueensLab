# Its own Render service. Nothing here touches BizGenome — no shared database,
# no shared repo, no shared environment.
services:
  - type: web
    name: queenslab
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      # The Bronze archive. An HMAC key for a service account scoped to this
      # ONE bucket in the separate `queens-data` GCP project — it cannot reach
      # BizGenome's database or anything else in Google Cloud.
      - key: GCS_BUCKET
        value: queenslab-research-yourteam-2026
      - key: GCS_HMAC_KEY_ID
        sync: false             # paste in the Render dashboard
      - key: GCS_HMAC_SECRET
        sync: false             # paste in the Render dashboard
      # Optional. Without it POST /fetch is switched off (pulls run on a laptop).
      # With it, send the same value in an X-Fetch-Token header.
      - key: FETCH_TOKEN
        sync: false
      # Firecrawl, for the Websites control panel (research only).
      - key: FIRECRAWL_API_KEY
        sync: false
      # Claude, for "Ask in plain English" (writes SQL; answers come from the data).
      # Use a key made just for QueensLab so its spend is visible on its own.
      - key: ANTHROPIC_API_KEY
        sync: false
      # ⚠️ DELIBERATELY NO DATABASE_URL. This service must never be able to
      # reach BizGenome's Neon database. Its only store is a local DuckDB file.
